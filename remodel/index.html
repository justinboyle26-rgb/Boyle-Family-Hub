<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Boyle Remodel</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<style>
:root {
  --bg: #DFE6E0;
  --surface: rgba(255,255,255,.92);
  --surface2: #F1F4F1;
  --border: rgba(25,45,35,.12);
  --text: #15231C;
  --text2: #3A4C42;
  --text3: #5A6B61;
  --accent: #2E7D5B;
  --accent2: #C8364F;
  --shadow: 0 10px 30px rgba(25,45,35,.08);
  --radius: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: Inter, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h1 { font-family: Outfit, sans-serif; font-size: 1.7rem; font-weight: 600; letter-spacing: -.03em; }
h2 { font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); margin: 22px 0 10px; }
a { color: var(--accent); }
#auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(900px 620px at 10% 0%, rgba(134,239,172,.22), transparent 60%), radial-gradient(900px 700px at 100% 100%, rgba(125,211,252,.16), transparent 60%), var(--bg); }
.setup-card { width: 460px; max-width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 40px 36px; box-shadow: var(--shadow); }
.setup-card h1 { font-size: 2.2rem; margin-bottom: 8px; }
.setup-card p { color: var(--text2); line-height: 1.55; margin-bottom: 22px; }
.form-group { margin-bottom: 14px; }
.form-group label, .field > span { display: block; font-size: .75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text2); margin-bottom: 6px; }
input, select, textarea { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn { padding: 11px 16px; border-radius: 10px; border: 1px solid transparent; background: var(--surface2); color: var(--text2); font-weight: 600; cursor: pointer; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #276b4e; }
.btn-ghost { border-color: var(--border); }
.auth-actions { display: flex; flex-direction: column; gap: 10px; }
.auth-alt { background: none; border: none; color: var(--text3); cursor: pointer; text-decoration: underline; padding: 4px; }
#auth-msg { margin-top: 12px; min-height: 1.2em; text-align: center; font-size: .84rem; color: var(--text3); }
#app { display: none; min-height: 100vh; }
.sidebar { position: fixed; inset: 0 auto 0 0; width: 280px; background: #24382F; color: #E6EEE8; display: flex; flex-direction: column; z-index: 20; }
.sidebar-header { display: flex; gap: 10px; align-items: center; padding: 18px 16px 12px; }
.brand-mark { width: 36px; height: 36px; border-radius: 10px; background: #F3F7F4; color: var(--accent); display: flex; align-items: center; justify-content: center; font-family: Outfit, sans-serif; font-weight: 600; }
.brand-text strong { display: block; font-family: Outfit, sans-serif; font-size: 1.15rem; font-weight: 600; }
.brand-text span, #brand-sub { color: #C5D4CC; font-size: .82rem; }
.nav { padding: 8px; overflow: auto; }
.nav button, a.nav-link { width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 12px; border: none; border-radius: 12px; background: transparent; color: #E6EEE8; text-align: left; text-decoration: none; cursor: pointer; font-weight: 500; }
.nav button svg { width: 18px; height: 18px; flex-shrink: 0; }
.nav button svg, .nav button svg * { stroke: currentColor; fill: none; stroke-width: 2; }
.nav button:hover, a.nav-link:hover { background: rgba(255,255,255,.08); }
.nav button.active { background: #F3F7F4; color: var(--accent); }
.sync { margin-top: auto; padding: 14px 16px; color: #C5D4CC; font-size: .8rem; display: flex; gap: 8px; align-items: center; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #7DCEA0; }
.sync-dot.syncing { background: #E0B15A; }
.sync-dot.error { background: #E07A7A; }
.menu-btn { display: none; position: fixed; top: 12px; left: 12px; z-index: 30; width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--border); background: #fff; }
.overlay { display: none; }
.main { margin-left: 280px; padding: 28px 32px 64px; }
.page-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; margin-bottom: 16px; }
.page-head .lede, .meta, .gap { color: var(--text2); line-height: 1.5; }
.gap, .meta { margin: 8px 0 14px; }
.page-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.stat-row, .split { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.split { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 12px; }
.stat, .note, .card, .room-card, .line, .add-bar, .stack { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.stat { padding: 14px 16px; }
.stat span { display: block; color: var(--text3); font-size: .75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 4px; }
.stat strong { font-family: Outfit, sans-serif; font-size: 1.45rem; font-weight: 600; letter-spacing: -.03em; }
.note { padding: 14px 16px; margin: 8px 0 18px; }
.room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.room-card { text-align: left; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.room-card:hover { border-color: rgba(46,125,91,.45); }
.room-top { display: flex; justify-content: space-between; gap: 8px; }
.room-top em { font-style: normal; color: var(--accent); font-size: .78rem; font-weight: 600; }
.room-sub, .room-cost { color: var(--text2); font-size: .86rem; }
.line { padding: 12px 14px; margin-bottom: 8px; display: grid; grid-template-columns: minmax(0, 1.3fr) auto auto; gap: 10px 14px; align-items: center; }
.line h3 { font-size: 1rem; font-weight: 600; }
.line p { color: var(--text2); font-size: .84rem; margin-top: 3px; }
.who { display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #fff; }
.who button { border: 0; border-right: 1px solid var(--border); background: transparent; min-height: 40px; padding: 8px 10px; cursor: pointer; font-weight: 600; color: var(--text2); }
.who button:last-child { border-right: 0; }
.who button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.prices { display: flex; gap: 14px; }
.prices p { text-align: right; min-width: 72px; }
.prices span { display: block; font-size: .72rem; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.prices strong { font-weight: 600; font-variant-numeric: tabular-nums; }
.line-edit { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.line-edit label { font-size: .75rem; color: var(--text3); font-weight: 600; }
.line-edit input { width: 110px; padding: 8px 10px; }
.add-bar, .stack, .card { padding: 14px; margin: 12px 0; }
.add-bar { display: flex; gap: 8px; }
.add-bar input, .add-bar select { flex: 1; }
.stack .split { margin-top: 0; }
.check { display: flex; align-items: center; gap: 8px; min-height: 42px; align-self: end; }
.check input { width: auto; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text3); }
td:nth-child(n+2), th:nth-child(n+2) { text-align: right; font-variant-numeric: tabular-nums; }
.text-btn { background: none; border: none; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; }
.text-btn.danger, .danger-btn { color: var(--accent2); }
.card-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.card h2, .card-head h2 { margin: 0; text-transform: none; letter-spacing: 0; font-size: 1.05rem; color: var(--text); }
.plain { margin: 10px 0 0; padding-left: 18px; }
.checks { list-style: none; padding: 0; margin: 12px 0; }
.checks li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.checks li.done label { color: var(--text3); text-decoration: line-through; }
.checks label { display: flex; gap: 8px; align-items: center; flex: 1; }
.checks input { width: auto; }
.empty { color: var(--text2); padding: 8px 0 16px; }
.cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0 12px; }
.cal-nav h2 { margin: 0; text-transform: none; letter-spacing: 0; font-size: 1.15rem; color: var(--text); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { text-align: center; font-size: .72rem; font-weight: 700; color: var(--text3); padding: 4px 0; }
.day { min-height: 84px; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 6px; cursor: pointer; }
.day.out { opacity: .45; }
.day.today { border-color: var(--accent); }
.day.in-phase { background: #F3F7F4; }
.day.pick { box-shadow: inset 0 0 0 2px var(--accent); }
.day .num { display: block; font-weight: 700; font-size: .78rem; }
.chip { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: #E4F0E8; color: #1B5E45; border-radius: 6px; padding: 1px 4px; margin-top: 2px; font-size: .68rem; font-weight: 600; }
.chip.phase { background: #E7EEF4; color: #1E4A6B; }
.idea-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; align-items: start; }
.idea { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.idea .pin { min-height: 40px; margin-top: 8px; overflow: hidden; }
.file { position: relative; display: inline-flex; align-items: center; }
#modal[hidden] { display: none; }
#modal { position: fixed; inset: 0; background: rgba(21,35,28,.45); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 18px; }
#modal-card { width: 640px; max-width: 100%; max-height: 90vh; overflow: auto; background: #fff; border-radius: 18px; padding: 20px; }
#modal-card h2 { margin-bottom: 12px; text-transform: none; letter-spacing: 0; font-size: 1.3rem; color: var(--text); }
#toast[hidden] { display: none; }
#toast { position: fixed; bottom: 16px; right: 16px; background: #15231C; color: #fff; padding: 12px 14px; border-radius: 10px; z-index: 50; }
#toast.error { background: var(--accent2); }
.rates { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 900px) {
  .menu-btn { display: flex; align-items: center; justify-content: center; }
  .sidebar { transform: translateX(-105%); transition: transform .2s ease; }
  .sidebar.open { transform: none; }
  .overlay.on { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 15; }
  .main { margin-left: 0; padding: 64px 16px 48px; }
  .stat-row, .split, .rates { grid-template-columns: 1fr 1fr; }
  .page-head { flex-direction: column; align-items: stretch; }
  .line { grid-template-columns: 1fr; }
  .prices p { text-align: left; }
}
@media (max-width: 560px) {
  .stat-row, .split, .rates, .add-bar { grid-template-columns: 1fr; display: grid; }
  .add-bar { display: grid; }
}
</style>
</head>
<body>
<div id="auth-screen">
  <div class="setup-card">
    <h1>Boyle Remodel</h1>
    <p>Sign in with the family email and password. This is the same account as the to-do list, and this device stays signed in until you sign out.</p>
    <form id="auth-form">
      <div class="form-group"><label for="auth-email">Family email</label><input id="auth-email" type="email" autocomplete="username" required></div>
      <div class="form-group"><label for="auth-pass">Password</label><input id="auth-pass" type="password" autocomplete="current-password" required minlength="6"></div>
      <div class="auth-actions">
        <button type="submit" class="btn btn-primary">Sign in</button>
        <button type="button" class="btn btn-ghost" id="auth-create" hidden>Create family account</button>
        <button type="button" class="auth-alt" id="auth-reset">Forgot password?</button>
      </div>
    </form>
    <div id="auth-msg">Checking sign-in…</div>
  </div>
</div>
<div id="app">
  <button type="button" class="menu-btn" data-act="menu" aria-label="Open menu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="overlay" id="overlay" data-act="menu"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand-mark" aria-hidden="true">B</div>
      <div class="brand-text"><strong>Boyle Remodel</strong><span id="brand-sub">Remodel</span></div>
    </div>
    <nav class="nav" aria-label="Remodel">
      <button type="button" data-act="nav" data-nav="overview" class="active"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>Overview</button>
      <button type="button" data-act="nav" data-nav="rooms"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>Rooms</button>
      <button type="button" data-act="nav" data-nav="budget"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="M8 16v-5M12 16V8M16 16v-3"/></svg>Budget</button>
      <button type="button" data-act="nav" data-nav="plan"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><path d="m4 6 .8.8L6.5 5M4 12l.8.8L6.5 11M4 18l.8.8L6.5 17"/></svg>Plan</button>
      <button type="button" data-act="nav" data-nav="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
      <button type="button" data-act="nav" data-nav="ideas"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.2"/></svg>Ideas</button>
      <button type="button" data-act="nav" data-nav="bids"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h7"/></svg>Bids</button>
      <button type="button" data-act="nav" data-nav="selections"><svg viewBox="0 0 24 24"><path d="m12 3 2.2 6.4H21l-5.4 4 2 6.6L12 16.8 6.4 20l2-6.6L3 9.4h6.8z"/></svg>Selections</button>
      <button type="button" data-act="nav" data-nav="decisions"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><path d="m4 6 .8.8L6.5 5M4 12l.8.8L6.5 11M4 18l.8.8L6.5 17"/></svg>Decisions</button>
      <button type="button" data-act="nav" data-nav="punch"><svg viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg>Punch</button>
      <button type="button" data-act="nav" data-nav="expenses"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>Expenses</button>
      <button type="button" data-act="nav" data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>Settings</button>
      <a class="nav-link" href="../">Back to the hub</a>
    </nav>
    <div class="sync"><span class="sync-dot" id="sync-dot"></span><span id="sync-text">Checking sign-in…</span></div>
  </aside>
  <main class="main" id="view"></main>
</div>
<div id="modal" hidden><div id="modal-card" role="dialog" aria-modal="true" aria-label="Room"></div></div>
<div id="toast" hidden role="status"></div>
<script src="catalog.js"></script>
<script src="app.js"></script>
</body>
</html>
